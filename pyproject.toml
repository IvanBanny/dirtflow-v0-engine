[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dirtflow-engine"
version = "0.1.0"
description = "Minecraft region generation with Dirtflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
dependencies = ["numpy==2.4.6", "torch>=2.12.0,<2.13", "transformers==5.13.0", "huggingface-hub==1.33.0", "safetensors==0.8.0", "fastapi==0.136.3", "uvicorn==0.49.0", "pydantic>=2.12.5,<2.14", "sse-starlette==3.4.4"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.15.17", "mypy>=1.15", "build>=1.2"]

[project.scripts]
dirtflow-engine = "dirtflow_engine.cli:main"

[project.urls]
Homepage = "https://github.com/IvanBanny/dirtflow-v0"
Repository = "https://github.com/IvanBanny/dirtflow-v0-engine"
Issues = "https://github.com/IvanBanny/dirtflow-v0-engine/issues"
Model = "https://huggingface.co/IvanBanny/dirtflow-v0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["integration: requires a model bundle and CUDA"]

[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cu132" }
