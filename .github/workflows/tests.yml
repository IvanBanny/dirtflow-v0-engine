name: Tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev]'
      - run: pytest -m 'not integration'
      - run: ruff check --no-cache src tests
      - run: ruff format --check --no-cache src tests
      - run: mypy --cache-dir /tmp/dirtflow-mypy src
      - run: python -m build --outdir /tmp/dirtflow-dist
